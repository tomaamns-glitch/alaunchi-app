appId: com.alaunchi.launcher
productName: ALaunchi
copyright: Copyright © 2026 ALaunchi

directories:
  buildResources: public
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraMetadata:
  main: electron/main.js

# Patches electron-builder's NSIS templates so an auto-update doesn't force
# Explorer to reload every desktop icon (see the script for details).
beforePack: scripts/patch-nsis-templates.cjs

win:
  target:
    - target: nsis
      arch: [x64]
  # Multi-size .ico built from public/logo.png (exe, installer, shortcuts, taskbar).
  icon: public/icon.ico
  # Same icon as a plain file next to app.asar — main.js' refreshShortcutIcons()
  # points the shortcuts at a copy of it so a logo change always shows up.
  extraResources:
    - from: public/icon.ico
      to: app-icon.ico
  artifactName: ALaunchi-Setup-${version}.exe

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ALaunchi

publish:
  provider: github
  owner: tomaamns-glitch
  # Repo público dedicado solo a releases del launcher (el .exe + latest.yml), separado
  # del código fuente (privado) para que electron-updater no necesite un token en el
  # cliente — un token embebido en la app se puede extraer del binario.
  repo: alaunchi-release
