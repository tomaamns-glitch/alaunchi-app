<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ALaunchi</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0d0d0d;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    box-sizing: border-box;
    padding: 40px 0 36px;
  }
  .wordmark {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .wordmark .al {
    color: hsl(205 90% 55%);
  }
  .spinner {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.08);
    border-top-color: hsl(205 90% 55%);
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .status-text {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.75);
  }
  .status-percent {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: hsl(205 90% 55%);
    min-height: 14px;
  }
</style>
</head>
<body>
  <div class="wordmark"><span class="al">AL</span>aunchi</div>
  <div class="spinner"></div>
  <div class="status">
    <div class="status-text" id="statusText">Cargando...</div>
    <div class="status-percent" id="statusPercent"></div>
  </div>

  <script>
    const statusText = document.getElementById("statusText");
    const statusPercent = document.getElementById("statusPercent");

    window.splashAPI?.onState((data) => {
      if (data.state === "updating") {
        statusText.textContent = "Actualizando...";
        statusPercent.textContent = data.percent ? Math.round(data.percent) + "%" : "";
      } else {
        statusText.textContent = "Cargando...";
        statusPercent.textContent = "";
      }
    });
  </script>
</body>
</html>
