<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ALaunchi</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0d0d0d;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    box-sizing: border-box;
    padding: 40px 0 36px;
  }
  /* Gradient waves behind everything (splash-effects.js). */
  #waves {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .brand, .spinner, .status {
    position: relative;
    z-index: 1;
  }
  .status-percent {
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
  }
  /* Shimmer sweeping across the status text, from React Bits' Thought Line
     (reactbits.dev/micro/thought-line, MIT + Commons Clause). The text is
     transparent, so the shadow goes on as a filter instead of text-shadow. */
  .status-text {
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0.6) 36%,
      #bfe3ff 46%,
      #ffffff 50%,
      #bfe3ff 54%,
      rgba(255, 255, 255, 0.6) 64%
    );
    /* Each loop moves the gradient exactly one tile (250% wide → -166.67%
       position), so the next copy picks up where this one left: no jump. */
    background-size: 250% 100%;
    background-repeat: repeat-x;
    background-position: 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 6px rgba(0, 0, 0, 0.6));
    animation: shimmer 2.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    to { background-position: -166.667% 0; }
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .brand img {
    width: 96px;
    height: 96px;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(20, 120, 255, 0.35));
  }
  /* Logo drawn as electric lines (splash-effects.js): arch and door traced
     separately so each keeps its color. The box is bigger than the logo so the
     glow isn't clipped; the margins give that space back to the layout. */
  .logo-electric {
    position: relative;
    width: 150px;
    height: 150px;
    margin: -27px 0;
  }
  .logo-electric > div {
    position: absolute;
    inset: 0;
  }
  .logo-electric > .door {
    pointer-events: none;
  }
  .wordmark {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .wordmark .al {
    color: hsl(205 90% 55%);
  }
  /* Loading indicator: the crystal ball (splash-ball.js), or the old ring if
     WebGL2 isn't there. */
  .spinner {
    width: 150px;
    height: 150px;
    margin: -40px 0 -36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner.fallback::after {
    content: "";
    width: 52px;
    height: 52px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.08);
    border-top-color: hsl(205 90% 55%);
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: -18px;
  }
  .status-text {
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .status-percent {
    transition: color 1.4s ease;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: hsl(205 90% 55%);
    min-height: 14px;
  }
  .updating .status-percent {
    color: hsl(25 95% 58%);
  }

  /* ─── Christmas (?xmas=1, see splashChristmasActive in main.js) ─────────── */
  #snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  /* Christmas: a star on the logo's apex. Its position comes
     from the logo masks (see the christmas script). */
  /* The box the electric star is drawn in: bigger than the star so its glow
     isn't clipped (like .logo-electric). */
  .xmas-star {
    position: absolute;
    z-index: 3;
    width: 56px;
    height: 56px;
    margin: -28px 0 0 -28px;
    pointer-events: none;
  }
  /* Christmas: the loading ball as a tree ornament — a red cap with a gold
     rim and loop on top (hanging from a thread), and white stars on it. The
     ball is ~92px across, centred in the 150px .spinner box. */
  .ornament-cap {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 4px;
    width: 30px;
    height: 34px;
    margin-left: -15px;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  }
  .ornament-stars {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 50%;
    width: 92px;
    height: 92px;
    margin: -46px 0 0 -46px;
    pointer-events: none;
    animation: ornament-swing 5s ease-in-out infinite;
  }
  .ornament-stars path { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8)); animation: ornament-twinkle 2.6s ease-in-out infinite; }
  .ornament-stars path:nth-child(2) { animation-delay: -0.9s; }
  .ornament-stars path:nth-child(3) { animation-delay: -1.7s; }
  @keyframes ornament-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes ornament-swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .tagline {
    margin-top: -6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #ffe3a8;
    text-shadow: 0 0 12px rgba(255, 190, 90, 0.45);
  }
  /* Christmas: shooting stars now and then across the top. Over the waves,
     under the logo and the text. */
  .shooting-star {
    position: fixed;
    z-index: 0;
    height: 2px;
    border-radius: 2px;
    pointer-events: none;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, #ffffff 0%, rgba(214, 236, 255, 0.85) 12%, rgba(160, 205, 255, 0.25) 55%, rgba(160, 205, 255, 0) 100%);
    filter: drop-shadow(0 0 4px rgba(200, 230, 255, 0.9));
  }

  /* Reyes: a single, slow and brighter shooting star instead of the quick ones. */
  .comet {
    position: fixed;
    z-index: 0;
    height: 3px;
    border-radius: 3px;
    pointer-events: none;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, #fffaf0 0%, rgba(255, 228, 170, 0.9) 8%, rgba(255, 210, 140, 0.4) 45%, rgba(255, 200, 120, 0) 100%);
    filter: drop-shadow(0 0 6px rgba(255, 220, 160, 0.9));
  }
  .comet::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0 22%, rgba(255, 230, 175, 0.75) 45%, rgba(255, 210, 140, 0) 72%);
  }

  /* ─── Reyes (?reyes=1, 2–6 January, see splashSeason in main.js) ──────────
     The three kings on camels cross the bottom of the window, behind the
     status text. Our own SVG + CSS (no third-party art). */
  .reyes-band {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 150px;
    z-index: 1;
    pointer-events: none;
    --silhouette: #070b16;
    --rim: rgba(255, 205, 130, 0.55);
    --gold: #ffd27a;
  }
  .reyes-band svg { width: 100%; height: 100%; display: block; }
  /* The status text stays in front of the caravan. */
  .status { z-index: 2; }
  .reyes .tagline { color: #ffe3a8; }
  .r-twinkle { animation: r-twinkle 3s ease-in-out infinite; }
  @keyframes r-twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
  /* From just off the left edge (the leading camel's nose) to just past the
     right one (the last camel's tail): it enters at once, and loops without a
     long empty gap. The negative delay starts it already stepping in. */
  .r-caravan { animation: r-walk 19s linear -1s infinite; }
  @keyframes r-walk { from { transform: translateX(-300px); } to { transform: translateX(430px); } }
  .r-body { animation: r-bob .9s ease-in-out infinite; }
  @keyframes r-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.2px); } }
  .r-neck { transform-box: fill-box; transform-origin: 10% 90%; animation: r-neck .9s ease-in-out infinite; }
  @keyframes r-neck { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
  .r-leg { transform-box: fill-box; transform-origin: 50% 0%; animation: r-stride 1.8s ease-in-out infinite; }
  .r-leg.b { animation-delay: -.9s; }
  @keyframes r-stride { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
  .r-rider { animation: r-sway .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes r-sway { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-1.5px); } }
  .r-cape { animation: r-cape 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0%; }
  @keyframes r-cape { 0%, 100% { transform: skewY(0deg) rotate(0deg); } 50% { transform: skewY(-4deg) rotate(3deg); } }
  .r-gift { animation: r-gift 2.4s ease-in-out infinite; }
  @keyframes r-gift { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  .k2 .r-body, .k2 .r-neck, .k2 .r-rider { animation-delay: -.3s; }
  .k2 .r-leg { animation-delay: -.6s; } .k2 .r-leg.b { animation-delay: -1.5s; }
  .k3 .r-body, .k3 .r-neck, .k3 .r-rider { animation-delay: -.55s; }
  .k3 .r-leg { animation-delay: -1.1s; } .k3 .r-leg.b { animation-delay: -.2s; }
  /* ─── Nochebuena → Nochevieja (?santa=1, 24–31 December, with ?xmas=1) ─────
     Santa in his sleigh pulled by reindeer flies up across the sky, from the
     bottom left to the top right, behind the logo, the ball and the text.
     Our own SVG + CSS. */
  .santa-band {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    --silhouette: #070b16;
    --rim: rgba(255, 205, 130, 0.55);
  }
  .santa-band svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .s-flight { animation: s-fly 15s linear -2.5s infinite; }
  @keyframes s-fly {
    from { transform: translate(-440px, 360px) rotate(-14deg); }
    to { transform: translate(450px, 30px) rotate(-14deg); }
  }
  .s-bob { animation: s-bob 2.6s ease-in-out infinite; }
  @keyframes s-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .s-leg { transform-box: fill-box; transform-origin: 50% 0%; animation: s-gallop .7s ease-in-out infinite; }
  .s-leg.back { animation-delay: -.35s; }
  @keyframes s-gallop { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(-10deg); } }
  .s-deer { animation: s-deer .7s ease-in-out infinite; }
  @keyframes s-deer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .d2 .s-deer, .d2 .s-leg { animation-delay: -.18s; } .d2 .s-leg.back { animation-delay: -.53s; }
  .d3 .s-deer, .d3 .s-leg { animation-delay: -.36s; } .d3 .s-leg.back { animation-delay: -.01s; }
  .d4 .s-deer, .d4 .s-leg { animation-delay: -.5s; } .d4 .s-leg.back { animation-delay: -.15s; }
  .s-nose { animation: s-nose 1.4s ease-in-out infinite; }
  @keyframes s-nose { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .s-spark { animation: s-spark 1.2s ease-in-out infinite; }
  @keyframes s-spark { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
  .s-santa-arm { transform-box: fill-box; transform-origin: 0% 50%; animation: s-wave 1.6s ease-in-out infinite; }
  @keyframes s-wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
</style>
</head>
<body>
  <div id="waves"></div>
  <div class="brand">
    <div class="logo-electric" id="logo"><div class="arch"></div><div class="door"></div></div>
    <div class="wordmark"><span class="al">AL</span>aunchi</div>
  </div>
  <div class="spinner" id="ball"></div>
  <div class="status">
    <div class="status-text" id="statusText">Cargando</div>
    <div class="status-percent" id="statusPercent"></div>
  </div>

  <script src="splash-effects.js"></script>
  <script>
    // Background. If WebGL2 isn't there the splash keeps its plain background.
    try {
      window.mountGradientWaves?.(document.getElementById("waves"), {
        horizonColor: "#0A3AD6",
        waveColor: "#1F7DFF",
        crestColor: "#8FD0FF",
        brightness: 1,
        mouseInteraction: true,
      });
    } catch (e) {
      console.error("[splash] waves:", e);
    }

    // Logo as electric lines; the plain image if WebGL2 isn't there.
    (function electricLogo() {
      const logo = document.getElementById("logo");
      const common = { scale: 0.68, fitImage: true, thickness: 1.3, strands: 3, crackle: 1.2, bend: 0.5, glow: 0.8, intensity: 1, speed: 2 };
      let ok = false;
      try {
        if (window.mountElectricLogo) {
          ok = !!window.mountElectricLogo(logo.querySelector(".arch"), { ...common, src: window.splashLogoMasks.arch, color: "#c4e4ff", glowColor: "#2f8cff" });
          if (ok) window.mountElectricLogo(logo.querySelector(".door"), { ...common, src: window.splashLogoMasks.door, color: "#ffe3a8", glowColor: "#ff8a1a", arcs: 0.6 });
        }
      } catch (e) {
        console.error("[splash] electric logo:", e);
      }
      if (!ok) logo.outerHTML = '<img src="splash-logo.png" alt="" draggable="false" />';
    })();

    // Blue while loading, fades to orange while an update downloads/installs.
    // Christmas: the ball is a green tree ornament (cap and stars added below).
    const BALL_BLUE = (() => {
      const p = new URLSearchParams(location.search);
      if (p.get("xmas") !== "1") return "#3D9BFF";
      return p.get("santa") === "1" ? "#FF3B4A" : "#2BD46B"; // 24–31 Dec: red ornament
    })();
    const BALL_ORANGE = "#FF8A2A";
    let ball = null;
    (function crystalBall() {
      const el = document.getElementById("ball");
      let ok = false;
      try {
        if (window.mountCrystalizedBall) {
          ball = window.mountCrystalizedBall(el, { preset: "abyss", color: BALL_BLUE, size: 0.6, particleCount: 3500, interactive: true });
          ok = !!el.querySelector("canvas");
        }
      } catch (e) {
        console.error("[splash] crystal ball:", e);
      }
      if (!ok) el.classList.add("fallback");
    })();
  </script>
  <script>
    // Christmas decoration (main.js adds ?xmas=1 from 1 December to 1 January,
    // by date only — see splashSeasonQuery): snow (unless ?nosnow=1), the star
    // on the logo, the ornament ball and "Felices fiestas". ?state=updating|
    // installing only previews those states in a browser (the real splash gets
    // them by IPC).
    (function christmas() {
      const params = new URLSearchParams(location.search);
      if (params.get("xmas") !== "1") return;
      document.body.classList.add("xmas");

      // Christmas: the usual logo with a star on the apex. Only on the electric logo (the plain-image
      // fallback, without WebGL, has no box). Mask pixels (512×512, fitted and
      // scaled 0.68 in the 150px box, like mountElectricLogo does) → box px.
      const logo = document.getElementById("logo");
      if (logo) {
        const box = 150, k = (box * 0.68) / 512;
        const at = (u, v) => [box / 2 + (u - 256) * k, box / 2 + (v - 256) * k];
        // The apex (mask units).
        const apex = [256, 52];
        const [sx, sy] = at(apex[0], apex[1] - 30);
        // The star is drawn with the same electric lines as the logo
        // (mountElectricLogo), in the door's gold: a five-pointed star mask
        // painted on a canvas. Without WebGL it falls back to a plain SVG star.
        const starBox = document.createElement("div");
        starBox.className = "xmas-star";
        starBox.style.left = sx + "px";
        starBox.style.top = sy + "px";
        logo.appendChild(starBox);
        const mask = document.createElement("canvas");
        mask.width = mask.height = 512;
        const g = mask.getContext("2d");
        g.fillStyle = "#fff";
        g.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? 236 : 100;
          const a = -Math.PI / 2 + (i * Math.PI) / 5;
          const x = 256 + Math.cos(a) * r, y = 268 + Math.sin(a) * r;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.closePath();
        g.fill();
        let ok = false;
        try {
          ok = !!window.mountElectricLogo?.(starBox, {
            scale: 0.68, fitImage: true, thickness: 1.3, strands: 3, crackle: 1.2, bend: 0.5, glow: 0.8, intensity: 1, speed: 2,
            src: mask.toDataURL(), color: "#ffe3a8", glowColor: "#ff8a1a", arcs: 0.6,
          });
        } catch (e) {
          console.error("[splash] electric star:", e);
        }
        if (!ok) {
          starBox.innerHTML =
            '<svg viewBox="-20 -20 40 40" width="100%" height="100%" aria-hidden="true">' +
            '<path d="M0 -13 L3.8 -4.2 L13 -4 L5.9 2 L8.2 11 L0 6 L-8.2 11 L-5.9 2 L-13 -4 L-3.8 -4.2 Z" fill="#ffd34d" stroke="#fff3c4" stroke-width="1.2" stroke-linejoin="round"/>' +
            "</svg>";
        }
      }

      // The loading ball as a tree ornament: cap + loop + thread, and stars.
      const ballBox = document.getElementById("ball");
      // Cap colours: red on the green ball; green on the red one (24–31 Dec).
      const capMain = params.get("santa") === "1" ? "#1f9d55" : "#e0263a";
      const capDark = params.get("santa") === "1" ? "#14753e" : "#c21a2d";
      const capLine = params.get("santa") === "1" ? "#0e5a2f" : "#a5121f";
      const capShine = params.get("santa") === "1" ? "#7be3a6" : "#ff8a95";
      if (ballBox) {
        ballBox.insertAdjacentHTML(
          "beforeend",
          '<svg class="ornament-cap" viewBox="0 0 30 34" aria-hidden="true">' +
            '<line x1="15" y1="-40" x2="15" y2="8" stroke="rgba(255,225,160,0.55)" stroke-width="1"/>' +
            '<circle cx="15" cy="10" r="4.2" fill="none" stroke="#f5c451" stroke-width="2"/>' +
            '<rect x="6" y="14" width="18" height="14" rx="2.5" fill="' + capMain + '"/>' +
            '<rect x="6" y="14" width="18" height="3.2" rx="1.6" fill="#f5c451"/>' +
            '<rect x="6" y="25" width="18" height="3" rx="1.5" fill="' + capDark + '"/>' +
            '<path d="M10 17.5 V 25 M15 17.5 V 25 M20 17.5 V 25" stroke="' + capLine + '" stroke-width="1.2" opacity="0.7"/>' +
            '<rect x="8" y="18" width="2.4" height="6" rx="1.2" fill="' + capShine + '" opacity="0.6"/>' +
          "</svg>" +
          '<svg class="ornament-stars" viewBox="0 0 92 92" aria-hidden="true" fill="#ffffff">' +
            '<path d="M30 30 l2.6 5.6 6 .7 -4.5 4.1 1.3 6 -5.4-3 -5.4 3 1.3-6 -4.5-4.1 6-.7z"/>' +
            '<path d="M58 44 l2 4.4 4.8 .5 -3.6 3.3 1 4.8 -4.2-2.4 -4.2 2.4 1-4.8 -3.6-3.3 4.8-.5z"/>' +
            '<path d="M38 60 l1.6 3.4 3.7 .4 -2.8 2.5 .8 3.7 -3.3-1.9 -3.3 1.9 .8-3.7 -2.8-2.5 3.7-.4z"/>' +
          "</svg>"
        );
      }

      // "Felices fiestas" under the wordmark.
      const tagline = params.get("santa") === "1" ? "¡Feliz Navidad!" : "Felices fiestas";
      document.querySelector(".brand").insertAdjacentHTML("beforeend", '<div class="tagline">' + tagline + "</div>");


      // Falling snow, unless the player switched it off in Personalizar
      // (main.js adds ?nosnow=1 from settings.json's christmasSnow).
      if (params.get("nosnow") !== "1") {
        // Falling snow (2D canvas, over the waves, under nothing that's clicked).
        const canvas = document.createElement("canvas");
        canvas.id = "snow";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let w = 0, h = 0, flakes = [];
        const make = (anywhere) => ({
          x: Math.random() * w,
          y: anywhere ? Math.random() * h : -6,
          r: 0.8 + Math.random() * 2,
          speed: 16 + Math.random() * 30,
          drift: 8 + Math.random() * 16,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.35 + Math.random() * 0.5,
        });
        const resize = () => {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          flakes = Array.from({ length: 45 }, () => make(true));
        };
        resize();
        window.addEventListener("resize", resize);
        let last = performance.now();
        const tick = (now) => {
          const dt = Math.min((now - last) / 1000, 0.1);
          last = now;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = "#ffffff";
          for (const f of flakes) {
            f.phase += dt * 0.8;
            f.y += f.speed * dt;
            f.x += Math.sin(f.phase) * f.drift * dt;
            if (f.y > h + 6) Object.assign(f, make(false));
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    })();
  </script>
  <script>
    // Reyes (main.js adds ?reyes=1 from 2 to 6 January): the caravan of the

  <script>
    // Christmas: quick shooting stars across the top every few seconds.
    (function shootingStars() {
      const params = new URLSearchParams(location.search);
      if (params.get("xmas") !== "1") return;
      const waves = document.getElementById("waves");
      const shoot = () => {
        const w = window.innerWidth, h = window.innerHeight;
        const angle = 18 + Math.random() * 16; // degrees below the horizontal, heading left
        const rad = (angle * Math.PI) / 180;
        const length = 70 + Math.random() * 60;
        const distance = 160 + Math.random() * 140;
        const x = w * (0.35 + Math.random() * 0.7);
        const y = h * (0.02 + Math.random() * 0.22);
        const el = document.createElement("div");
        el.className = "shooting-star";
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.width = length + "px";
        waves.after(el);
        const dx = -Math.cos(rad) * distance, dy = Math.sin(rad) * distance;
        const turn = "rotate(" + -angle + "deg)";
        const anim = el.animate(
          [
            { transform: "translate(0, 0) " + turn + " scaleX(0.3)", opacity: 0 },
            { opacity: 1, offset: 0.15 },
            { transform: "translate(" + dx + "px, " + dy + "px) " + turn + " scaleX(1)", opacity: 0 },
          ],
          { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.3,.1,.6,1)" }
        );
        anim.onfinish = () => el.remove();
      };
      const next = () => setTimeout(() => { shoot(); next(); }, 3500 + Math.random() * 5500);
      setTimeout(shoot, 1200);
      next();
    })();
  </script>
  <script>
    // Reyes: one slow, bright shooting star crossing the top from left to
    // right — the same way the caravan walks — again and again with a pause.
    (function reyesComet() {
      if (new URLSearchParams(location.search).get("reyes") !== "1") return;
      const waves = document.getElementById("waves");
      const pass = () => {
        const w = window.innerWidth, h = window.innerHeight;
        const angle = 9 + Math.random() * 6; // shallow, almost level
        const rad = (angle * Math.PI) / 180;
        const length = 150 + Math.random() * 40;
        const distance = w * 1.15;
        const el = document.createElement("div");
        el.className = "comet";
        el.style.left = -w * 0.02 + "px";
        el.style.top = h * (0.04 + Math.random() * 0.08) + "px";
        el.style.width = length + "px";
        waves.after(el);
        // The head is the element's left end (its origin); turned 180° + angle,
        // the tail trails behind it while it heads right and slightly down.
        const turn = "rotate(" + (180 + angle) + "deg)";
        const dx = Math.cos(rad) * distance, dy = Math.sin(rad) * distance;
        const anim = el.animate(
          [
            { transform: "translate(0, 0) " + turn, opacity: 0 },
            { opacity: 1, offset: 0.12 },
            { opacity: 1, offset: 0.8 },
            { transform: "translate(" + dx + "px, " + dy + "px) " + turn, opacity: 0 },
          ],
          { duration: 6500, easing: "linear" }
        );
        anim.onfinish = () => {
          el.remove();
          setTimeout(pass, 2500 + Math.random() * 2500);
        };
      };
      setTimeout(pass, 800);
    })();
  </script>

  <script>
    const statusText = document.getElementById("statusText");
    const statusPercent = document.getElementById("statusPercent");

    const applyState = (data) => {
      const updating = data.state === "updating" || data.state === "installing";
      ball?.setColor?.(updating ? BALL_ORANGE : BALL_BLUE, 1.4);
      document.body.classList.toggle("updating", updating);
      if (data.state === "updating") {
        statusText.textContent = "Actualizando";
        statusPercent.textContent = data.percent ? Math.round(data.percent) + "%" : "";
      } else if (data.state === "installing") {
        // The window closes right after this while the installer runs, and the
        // launcher reopens on its own — say so, so the gap isn't a surprise.
        statusText.textContent = "Instalando actualización";
        statusPercent.textContent = "ALaunchi se abrirá solo en unos segundos";
      } else {
        statusText.textContent = "Cargando";
        statusPercent.textContent = "";
      }
    };
    window.splashAPI?.onState(applyState);
    // Browser preview only (no splashAPI there): ?state=updating&percent=40.
    {
      const params = new URLSearchParams(location.search);
      const state = params.get("state");
      if (!window.splashAPI && state) applyState({ state, percent: Number(params.get("percent")) || 0 });
    }
  </script>
